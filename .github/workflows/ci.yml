name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Audit publishable content
        shell: bash
        run: python3 scripts/audit-public.py --ref HEAD

      - name: Run Swift tests
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null; then brew install ffmpeg; fi
          swift test
